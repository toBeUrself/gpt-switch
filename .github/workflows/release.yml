name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Verify release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust components
        run: |
          rustup update stable
          rustup component add clippy rustfmt

      - name: Verify tag matches Cargo version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version v${version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: gpt-switch-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust target
        run: |
          rustup update stable
          rustup target add "$TARGET"

      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Package release
        run: |
          mkdir -p package dist
          cp "target/$TARGET/release/gpt-switch" package/
          cp README.md package/
          tar -C package -czf "dist/$ARCHIVE" gpt-switch README.md
          cd dist
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
